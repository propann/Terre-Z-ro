name: Terre Zero CI

on:
  push:
  pull_request:

jobs:
  web:
    name: Web prototype
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - name: Install dependencies
        run: bun install --frozen-lockfile
      - name: Typecheck
        run: bun run lint
      - name: Build
        run: bun run build

  godot-dotnet:
    name: Godot C# compile
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - name: Validate Godot resources
        run: python3 tools/validate_godot_resources.py
      - name: Restore
        run: dotnet restore godot_project/TerreZero.csproj
      - name: Build
        run: dotnet build godot_project/TerreZero.csproj --no-restore --configuration Release

  go:
    name: Go backend
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: godot_project/server_go
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.24'
          cache-dependency-path: godot_project/server_go/go.mod
      - name: Resolve dependencies
        run: go mod tidy
      - name: Vet
        run: go vet ./...
      - name: Tests
        run: go test ./...
