name: Terre Zero CI

on:
  push:
  pull_request:

jobs:
  web:
    name: Web prototype
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - name: Install dependencies
        run: bun install --frozen-lockfile
      - name: Typecheck
        run: bun run lint
      - name: Build
        run: bun run build

  go:
    name: Go backend
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: godot_project/server_go
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.23'
      - name: Validate module
        run: |
          if [ -f go.mod ]; then
            go mod tidy
            go vet ./...
            go test ./...
          else
            echo "go.mod missing - backend module bootstrap still required"
          fi
